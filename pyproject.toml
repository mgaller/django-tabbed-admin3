[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-tabbed-admin3"
version = "3.2.0"
description = "Easily add tabs to django admin forms. Django 6.1 compatible fork."
readme = "README.rst"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt", "AUTHORS.txt"]
authors = [
    {name = "Guillaume Pousseo (original)"},
    {name = "Michael Galler (django 4 fork)"},
]
requires-python = ">=3.10"
dependencies = ["django>=4.2"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/mgaller/django-tabbed-admin3"

[tool.setuptools.packages.find]
include = ["tabbed_admin*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
tabbed_admin = ["templates/**/*.html", "static/**/*.css", "static/**/*.js", "static/**/*.png"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

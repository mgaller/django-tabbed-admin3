[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-tabbed-admin3"
version = "3.1.0"
description = "Easily add tabs to django admin forms. Django 6 compatible fork."
readme = "README.md"
license = {text = "BSD License"}
authors = [
    {name = "Guillaume Pousseo (original)"},
    {name = "Michael Galler (django 4 fork)"},
]
requires-python = ">=3.10"
dependencies = ["django>=4.2"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/mgaller/django-tabbed-admin3"

[tool.setuptools.packages.find]
include = ["tabbed_admin*"]
